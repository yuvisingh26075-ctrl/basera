<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basera: Find a stay across India</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f5;--sf:#fff;--ink:#14232b;--mute:#5b6c75;--line:#d5e0e4;--brand:#0f4c4f;--onb:#fff;--acc:#f2a33a;--err:#b3261e;--r:14px;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--sf:#15262d;--ink:#e8f1f3;--mute:#93a8b0;--line:#264049;--brand:#5fc4bf;--onb:#08201f;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1f;--sf:#15262d;--ink:#e8f1f3;--mute:#93a8b0;--line:#264049;--brand:#5fc4bf;--onb:#08201f;--err:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.brand{font:800 24px Fraunces,Georgia,serif;text-decoration:none;color:var(--brand)}
nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:15px}
nav a{text-decoration:none}
.btn{background:var(--brand);color:var(--onb);border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible,.chip:focus-visible,.heart:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{position:relative;min-height:440px;display:flex;align-items:flex-end;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(8,20,24,.78))}
.hin{position:relative;z-index:2;color:#fff;padding:40px 20px;width:100%;max-width:1100px;margin:0 auto}
.hin h1{font-size:clamp(32px,6vw,58px);max-width:15ch;font-weight:800}
.hin p{max-width:48ch;margin:10px 0 22px;opacity:.95}
.search{background:var(--sf);color:var(--ink);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr auto;gap:10px;align-items:end}
.search label,.bk label{display:grid;gap:3px;font-size:13px;color:var(--mute);font-weight:500}
.search input,.search select,.bk input,.bk select,.fm input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:26px 20px 60px}
.filters{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:7px 15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--onb);border-color:var(--brand)}
.filters select{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:7px}
.mute{color:var(--mute);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:14px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer}
.card:hover{border-color:var(--brand)}
.ph{position:relative;aspect-ratio:3/2;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:10px;top:10px;background:var(--sf);color:var(--ink);font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.heart{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#777;font-size:18px;cursor:pointer}
.heart.on{color:#e0245e}
.cb{padding:12px 14px 14px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:start}
.cb h3{font-size:18px}
.rate{background:var(--brand);color:var(--onb);border-radius:8px;padding:1px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(5,12,15,.62);z-index:40;overflow:auto;padding:20px}
.ov[hidden]{display:none}
.md{background:var(--sf);max-width:900px;margin:0 auto;border-radius:18px;padding:20px;position:relative}
.x{position:absolute;right:14px;top:12px;border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.gal{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:26px 0 14px}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.gal div{display:grid;gap:8px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
.am{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none;margin:12px 0}
.am li{background:var(--bg);border-radius:99px;padding:5px 12px;font-size:14px}
.bk{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-self:start}
.ln{display:flex;justify-content:space-between;font-size:14px}
.tot{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:8px}
.err{color:var(--err);font-size:14px;min-height:20px;margin:0}
.auth{max-width:900px;margin:30px auto;display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.auth>img{width:100%;height:100%;object-fit:cover;min-height:420px}
.fm{padding:30px;display:grid;gap:12px;align-content:center}
.tabs{display:flex;gap:6px}
.trip{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:160px 1fr auto;gap:16px;padding:12px;align-items:center;margin-top:14px}
.trip img{width:100%;border-radius:10px;display:block}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-size:14px}
#toast[hidden]{display:none}
@media (max-width:760px){.search{grid-template-columns:1fr 1fr}.search label:first-child,.search .btn{grid-column:1/-1}.cols,.auth{grid-template-columns:1fr}.auth>img{min-height:160px;max-height:180px}.trip{grid-template-columns:100px 1fr}.trip .btn{grid-column:1/-1}.gal{grid-template-columns:1fr}.gal div{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#">Basera</a><nav id="nav"></nav></header>
<main id="app"></main>
<div class="ov" id="ov" hidden><div class="md" id="md" role="dialog" aria-modal="true" aria-label="Stay details"></div></div>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const iso=d=>d.toISOString().slice(0,10);
const plus=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=new Date();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nights=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/864e5));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let token=store.get('bs_token'),user=JSON.parse(store.get('bs_user')||'null'),pending=null;
const S={q:'',type:'All',max:20000,minr:0,sort:'rec',ci:iso(plus(today,7)),co:iso(plus(today,9)),g:2,wish:new Set()};
const HC={};
function scene(t,s){
 const r=n=>{s=(s*9301+49297)%233280;return s/233280*n};
 const P={beach:['#ffb36b','#ff6f91','#1e6f8c'],mountain:['#8ec5ff','#e6f3ff','#2f4858'],city:['#2b2d6e','#ff8a5c','#14162f'],palace:['#ffd27d','#f08a4b','#8c3b2a'],lake:['#bfe3ff','#fdf3d6','#2a7f8f'],forest:['#a8e0a0','#f6f1b4','#1f5a3a']}[t];
 let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P[0]}"/><stop offset="1" stop-color="${P[1]}"/></linearGradient></defs><rect width="400" height="260" fill="url(#g)"/><circle cx="${60+r(280)}" cy="${60+r(40)}" r="${26+r(12)}" fill="#fff" opacity=".85"/>`;
 if(t=='beach'){o+=`<rect y="150" width="400" height="110" fill="${P[2]}"/><path d="M0 150h400" stroke="#fff" opacity=".5"/><path d="M0 215Q200 190 400 220V260H0Z" fill="#f3d9a4"/><path d="M${300+r(40)} 225Q320 150 ${290+r(20)} 110" stroke="#5a3a22" stroke-width="6" fill="none"/>`;for(let i=0;i<5;i++)o+=`<ellipse cx="${300+i*10-20}" cy="${108+(i%2)*8}" rx="34" ry="7" fill="#2f7d4a" transform="rotate(${i*40-80} 295 110)"/>`}
 else if(t=='mountain'||t=='lake'){for(let i=0;i<4;i++){const x=i*110-30,h=90+r(80);o+=`<path d="M${x} 190L${x+80} ${190-h}L${x+170} 190Z" fill="${P[2]}" opacity="${.5+i*.12}"/><path d="M${x+62} ${190-h+22}L${x+80} ${190-h}L${x+98} ${190-h+22}Z" fill="#fff"/>`}
  if(t=='lake')o+=`<rect y="190" width="400" height="70" fill="#4fa6b5"/><path d="M150 215h70l-12 14h-46Z" fill="#8c3b2a"/><path d="M185 215V190l22 25Z" fill="#fff"/>`;
  else{o+=`<rect y="190" width="400" height="70" fill="#dfeaf0"/>`;for(let i=0;i<9;i++){const x=i*46+r(20);o+=`<path d="M${x} 250l14-45 14 45Z" fill="#1f5a3a"/>`}}}
 else if(t=='city'){for(let x=0;x<400;x+=36){const h=70+r(110);o+=`<rect x="${x}" y="${250-h}" width="32" height="${h}" fill="${P[2]}"/>`;for(let y=250-h+8;y<240;y+=16)if(r(1)>.45)o+=`<rect x="${x+6}" y="${y}" width="6" height="8" fill="#ffd27d"/><rect x="${x+18}" y="${y}" width="6" height="8" fill="#ffd27d" opacity=".7"/>`}}
 else if(t=='palace'){o+=`<rect y="200" width="400" height="60" fill="#e0a96b"/><rect x="90" y="120" width="220" height="90" fill="${P[2]}"/><path d="M160 120Q200 40 240 120Z" fill="#c95f3b"/><rect x="198" y="48" width="4" height="26" fill="#c95f3b"/>`;for(let i=0;i<5;i++)o+=`<path d="M${108+i*40} 210v-34a14 14 0 0 1 28 0v34Z" fill="#ffd27d"/>`;o+=`<path d="M60 210V150Q75 120 90 150V210ZM310 210V150Q325 120 340 150V210Z" fill="#a8482f"/>`}
 else{o+=`<ellipse cx="90" cy="230" rx="200" ry="70" fill="#3d8a58"/><ellipse cx="330" cy="240" rx="200" ry="80" fill="${P[2]}"/>`;for(let i=0;i<10;i++){const x=i*42+r(18),y=190+r(40);o+=`<rect x="${x+9}" y="${y+22}" width="5" height="14" fill="#5a3a22"/><path d="M${x} ${y+26}l12-40 12 40Z" fill="#14472c"/>`}}
 return o+'</svg>';
}
const img=(t,s)=>'data:image/svg+xml;utf8,'+encodeURIComponent(scene(t,s));
async function api(path,o={}){
 const r=await fetch('/api'+path,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:o.body?JSON.stringify(o.body):undefined});
 let d=null;try{d=await r.json()}catch(e){}
 if(r.status==401&&token&&!path.startsWith('/auth')){signOut(true)}
 if(!r.ok)throw new Error((d&&d.error)||'Something went wrong. Try again.');
 return d;
}
function setSession(d){token=d.token;user=d.user;store.set('bs_token',token);store.set('bs_user',JSON.stringify(user));nav()}
function signOut(expired){token=null;user=null;S.wish=new Set();store.set('bs_token',null);store.set('bs_user',null);nav();if(expired)toast('Your session ended. Sign in again.')}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function nav(){
 $('#nav').innerHTML=`<a href="#">Stays</a><a href="#trips">My trips</a>`+(user?`<span>Hi, ${esc(user.name.split(' ')[0])}</span><button class="btn alt" id="out">Sign out</button>`:`<a class="btn" href="#login">Sign in</a>`);
 const o=$('#out');if(o)o.onclick=()=>{signOut();location.hash='';route();toast('You’re signed out.')};
}

/* HOME */
function home(){
 $('#app').innerHTML=`<section class="hero"><img alt="" src="${img('beach',7)}"><div class="hin"><h1>Find a room that feels like arriving.</h1><p>Hotels, villas and homestays across India, priced in rupees with taxes shown before you book.</p>
 <form class="search" id="sf"><label>Where to?<input id="q" list="cities" placeholder="Goa, Manali, Jaipur…" value="${esc(S.q)}"></label><datalist id="cities">${['Goa','Manali','Jaipur','Udaipur','Munnar','Mumbai','Rishikesh','Shimla','Delhi','Andaman','Srinagar'].map(c=>`<option value="${c}">`).join('')}</datalist>
 <label>Check-in<input type="date" id="ci" min="${iso(today)}" value="${S.ci}"></label><label>Check-out<input type="date" id="co" min="${S.ci}" value="${S.co}"></label>
 <label>Guests<select id="g">${[1,2,3,4,5,6,7,8].map(n=>`<option ${n==S.g?'selected':''}>${n}</option>`).join('')}</select></label><button class="btn">Search stays</button></form></div></section>
 <section class="wrap"><div class="filters" id="chips">${['All','Hotel','Villa','Homestay','Resort'].map(t=>`<button class="chip" aria-pressed="${t==S.type}" data-t="${t}">${t}</button>`).join('')}</div>
 <div class="filters"><label>Up to <b id="pv">${inr(S.max)}</b> a night <input type="range" id="pr" min="1500" max="20000" step="500" value="${S.max}"></label>
 <label>Rating <select id="mr"><option value="0">Any</option><option value="4">4.0+</option><option value="4.5">4.5+</option><option value="4.8">4.8+</option></select></label>
 <label>Sort <select id="so"><option value="rec">Recommended</option><option value="pa">Price, low to high</option><option value="pd">Price, high to low</option><option value="rt">Top rated</option></select></label></div>
 <p class="mute" id="cnt"></p><div class="grid" id="grid"></div></section>`;
 $('#mr').value=S.minr;$('#so').value=S.sort;
 $('#sf').onsubmit=e=>{e.preventDefault();S.q=$('#q').value.trim();S.ci=$('#ci').value;S.co=$('#co').value;S.g=+$('#g').value;
  if(nights(S.ci,S.co)<1){toast('Check-out must be after check-in.');return}list();$('#grid').scrollIntoView({behavior:'smooth'})};
 $('#ci').onchange=e=>{$('#co').min=e.target.value;if($('#co').value<=e.target.value)$('#co').value=iso(plus(e.target.value,1))};
 $('#chips').onclick=e=>{const t=e.target.dataset.t;if(!t)return;S.type=t;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.t==t));list()};
 $('#pr').oninput=e=>{S.max=+e.target.value;$('#pv').textContent=inr(S.max);list()};
 $('#mr').onchange=e=>{S.minr=+e.target.value;list()};$('#so').onchange=e=>{S.sort=e.target.value;list()};
 $('#grid').onclick=async e=>{const h=e.target.closest('.heart');
  if(h){e.stopPropagation();const id=+h.dataset.id;if(!user){toast('Sign in to save stays.');return}
   try{if(S.wish.has(id)){await api('/wishlist/'+id,{method:'DELETE'});S.wish.delete(id)}else{await api('/wishlist/'+id,{method:'PUT'});S.wish.add(id)}h.classList.toggle('on',S.wish.has(id))}catch(er){toast(er.message)}return}
  const c=e.target.closest('.card');if(c)openHotel(+c.dataset.id)};
 $('#grid').onkeydown=e=>{if(e.key=='Enter'&&e.target.classList.contains('card'))openHotel(+e.target.dataset.id)};
 list();
}
async function list(){
 const p=new URLSearchParams({maxPrice:S.max,minRating:S.minr,sort:S.sort});if(S.q)p.set('q',S.q);if(S.type!='All')p.set('type',S.type);
 const n=list.n=(list.n||0)+1;
 try{const a=await api('/hotels?'+p);if(n!=list.n||!$('#grid'))return;a.forEach(h=>HC[h.id]=h);
  $('#cnt').textContent=a.length?`${a.length} stay${a.length>1?'s':''} found`:'';
  $('#grid').innerHTML=a.length?a.map(h=>`<article class="card" tabindex="0" data-id="${h.id}"><div class="ph"><img alt="${esc(h.name)}, ${esc(h.city)}" src="${img(h.scene,h.id*13)}"><span class="tag">${esc(h.type)}</span><button class="heart ${S.wish.has(h.id)?'on':''}" data-id="${h.id}" aria-label="Save ${esc(h.name)}">♥</button></div>
  <div class="cb"><div class="row"><h3>${esc(h.name)}</h3><span class="rate">★ ${h.rating}</span></div><p class="mute">${esc(h.city)}, ${h.reviews.toLocaleString('en-IN')} reviews</p><p><b>${inr(h.price)}</b> <span class="mute">a night</span></p></div></article>`).join(''):'<p>No stays match these filters. Raise the price limit or choose All types.</p>'}
 catch(e){if($('#grid'))$('#grid').innerHTML=`<p class="err">${esc(e.message)} Check that the server is running.</p>`}
}

/* DETAIL + BOOKING */
function openHotel(id,v){
 const h=HC[id];if(!h)return;v=v||{ci:S.ci,co:S.co,g:S.g};
 $('#md').innerHTML=`<button class="x" aria-label="Close" id="cl">✕</button>
 <div class="gal"><img alt="" src="${img(h.scene,h.id*13)}" style="aspect-ratio:3/2"><div><img alt="" src="${img(h.scene,h.id*29)}"><img alt="" src="${img(h.scene,h.id*47)}"></div></div>
 <div class="cols"><div><h2>${esc(h.name)}</h2><p class="mute">${esc(h.type)} in ${esc(h.city)}, rated ★ ${h.rating} by ${h.reviews.toLocaleString('en-IN')} guests</p><p>${esc(h.description)}</p><h3>What’s included</h3><ul class="am">${h.amenities.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>
 <form class="bk" id="bf"><div><b style="font-size:22px">${inr(h.price)}</b> <span class="mute">a night</span></div>
 <label>Check-in<input type="date" id="bci" min="${iso(today)}" value="${v.ci}"></label><label>Check-out<input type="date" id="bco" min="${v.ci}" value="${v.co}"></label>
 <label>Guests (up to 3 per room)<select id="bg">${[1,2,3,4,5,6,7,8].map(n=>`<option ${n==v.g?'selected':''}>${n}</option>`).join('')}</select></label>
 <div id="sm"></div><p class="err" id="be" aria-live="polite"></p><button class="btn" id="rb">${user?'Reserve now':'Sign in to reserve'}</button><p class="mute" style="font-size:12px">Payment is collected at the property.</p></form></div>`;
 $('#ov').hidden=false;document.body.style.overflow='hidden';$('#cl').focus();
 let ok=false;
 const sum=async()=>{const ci=$('#bci').value,co=$('#bco').value,g=$('#bg').value,n=sum.n=(sum.n||0)+1;ok=false;$('#be').textContent='';
  if(nights(ci,co)<1){$('#sm').innerHTML='<p class="mute">Choose a check-out after check-in.</p>';return}
  try{const q=await api(`/hotels/${h.id}/quote?checkIn=${ci}&checkOut=${co}&guests=${g}`);if(n!=sum.n||!$('#sm'))return;ok=q.available;
   $('#sm').innerHTML=`<div class="ln"><span>${inr(h.price)} × ${q.nights} night${q.nights>1?'s':''} × ${q.rooms} room${q.rooms>1?'s':''}</span><span>${inr(q.base)}</span></div><div class="ln"><span>GST (12%)</span><span>${inr(q.tax)}</span></div><div class="ln"><span>Service fee (5%)</span><span>${inr(q.fee)}</span></div><div class="ln tot"><span>Total</span><span>${inr(q.total)}</span></div>`;
   if(!q.available)$('#be').textContent='No rooms left for these dates. Try different dates.'}
  catch(e){if($('#sm'))$('#sm').innerHTML='';if($('#be'))$('#be').textContent=e.message}};
 sum();
 $('#bci').onchange=e=>{$('#bco').min=e.target.value;if($('#bco').value<=e.target.value)$('#bco').value=iso(plus(e.target.value,1));sum()};
 ['bco','bg'].forEach(i=>$('#'+i).onchange=sum);
 $('#bf').onsubmit=e=>{e.preventDefault();const b={hotelId:h.id,checkIn:$('#bci').value,checkOut:$('#bco').value,guests:+$('#bg').value};
  if(!user){pending=b;closeM();location.hash='login';toast('Sign in to finish your booking.');return}
  if(!ok){$('#be').textContent=$('#be').textContent||'Choose valid dates.';return}book(b,$('#be'))};
}
async function book(b,errEl){
 try{const r=await api('/bookings',{method:'POST',body:b});
  $('#ov').hidden=false;document.body.style.overflow='hidden';
  $('#md').innerHTML=`<button class="x" aria-label="Close" id="cl">✕</button><div style="padding:24px 8px;text-align:center"><h2>Booking confirmed</h2><p>Reference <b>${esc(r.ref)}</b></p><p>${esc(r.hotel)}, ${esc(r.city)}<br>${r.checkIn} to ${r.checkOut}, ${r.nights} night${r.nights>1?'s':''}, ${r.guests} guest${r.guests>1?'s':''}<br><b>${inr(r.total)}</b> payable at the property</p><a class="btn" href="#trips" id="gt">View my trips</a></div>`;
  $('#gt').onclick=closeM}
 catch(e){if(errEl)errEl.textContent=e.message;else toast(e.message)}
}
function closeM(){$('#ov').hidden=true;document.body.style.overflow=''}
$('#ov').addEventListener('click',e=>{if(e.target.id=='ov'||e.target.id=='cl')closeM()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});

/* AUTH */
function login(mode){
 mode=mode||'in';const su=mode=='up';
 $('#app').innerHTML=`<div class="auth"><img alt="" src="${img('city',21)}"><form class="fm" id="af" novalidate><h2>${su?'Create your account':'Welcome back'}</h2><p class="mute">${su?'Save stays, book faster and manage trips in one place.':'Sign in to book and manage your trips.'}</p>
 <div class="tabs"><button type="button" class="chip" aria-pressed="${!su}" data-m="in">Sign in</button><button type="button" class="chip" aria-pressed="${su}" data-m="up">Create account</button></div>
 ${su?'<label class="mute">Full name<input id="nm" autocomplete="name"></label>':''}
 <label class="mute">Email<input id="em" type="email" autocomplete="email"></label>
 <label class="mute">Password${su?' (8+ characters)':''}<input id="pw" type="password" autocomplete="${su?'new-password':'current-password'}"></label>
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sp" style="width:auto"> Show password</label>
 <p class="err" id="ae" aria-live="polite"></p><button class="btn" id="ab">${su?'Create account':'Sign in'}</button></form></div>`;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>login(b.dataset.m));
 $('#sp').onchange=e=>$('#pw').type=e.target.checked?'text':'password';
 $('#af').onsubmit=async e=>{e.preventDefault();const er=$('#ae'),body={email:$('#em').value.trim(),password:$('#pw').value};er.textContent='';
  if(su){body.name=$('#nm').value.trim();if(body.name.length<2)return er.textContent='Enter your full name.';if(body.password.length<8)return er.textContent='Use at least 8 characters for your password.'}
  if(!/^\S+@\S+\.\S+$/.test(body.email))return er.textContent='Enter a valid email address.';
  $('#ab').disabled=true;
  try{setSession(await api(su?'/auth/signup':'/auth/login',{method:'POST',body}));
   try{S.wish=new Set(await api('/wishlist'))}catch(x){}
   toast(`Welcome, ${user.name.split(' ')[0]}.`);location.hash='';
   if(pending){const p=pending;pending=null;setTimeout(()=>book(p),60)}}
  catch(x){er.textContent=x.message;$('#ab').disabled=false}};
}

/* TRIPS */
async function trips(){
 if(!user){$('#app').innerHTML=`<div class="wrap"><h2>My trips</h2><p>Sign in to see your bookings.</p><a class="btn" href="#login">Sign in</a></div>`;return}
 $('#app').innerHTML='<div class="wrap"><h2>My trips</h2><p class="mute">Loading your bookings…</p></div>';
 try{const a=await api('/bookings');
  $('#app').innerHTML=`<div class="wrap"><h2>My trips</h2>${a.length?a.map(b=>`<div class="trip"><img alt="" src="${img(b.scene,b.hotel_id*13)}"><div><h3>${esc(b.hotel)}, ${esc(b.city)}</h3><p class="mute">${b.check_in} to ${b.check_out}, ${b.guests} guest${b.guests>1?'s':''}, ref ${esc(b.ref)}${b.status=='cancelled'?', cancelled':''}</p><b>${inr(b.total)}</b></div>${b.status=='confirmed'?`<button class="btn alt" data-r="${esc(b.ref)}">Cancel booking</button>`:'<span></span>'}</div>`).join(''):'<p>No trips yet. Pick a stay and your booking will show up here.</p><a class="btn" href="#">Browse stays</a>'}</div>`;
  $('#app').onclick=async e=>{const r=e.target.dataset.r;if(!r)return;try{await api('/bookings/'+r,{method:'DELETE'});toast('Booking cancelled.');trips()}catch(x){toast(x.message)}}}
 catch(e){$('#app').innerHTML=`<div class="wrap"><h2>My trips</h2><p class="err">${esc(e.message)}</p></div>`}
}
function route(){closeM();const h=location.hash.slice(1);nav();window.scrollTo(0,0);$('#app').onclick=null;h=='login'?login():h=='trips'?trips():home()}
addEventListener('hashchange',route);
(async()=>{if(token){try{await api('/me');S.wish=new Set(await api('/wishlist'))}catch(e){}}route()})();
</script>
</body>
